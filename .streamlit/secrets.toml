# Streamlit Community Cloud: paste into  Manage app → ⋮ → Settings → Secrets
# Local run: copy to .streamlit/secrets.toml          NEVER commit the real secrets.toml to GitHub.

# ── Required ──
TRAINER_PASSWORD = "1234"

# Permanent storage (free): Neon.tech or Supabase PostgreSQL connection string.
#   Supabase: use the "Session pooler" string (Streamlit Cloud has no IPv6).
DATABASE_URL = "postgresql://user:password@host:5432/dbname?sslmode=require"

# ── LLM judge: add ONE ──
GROQ_API_KEY = "gsk_..."          # free tier, open-source Llama models
# OPENAI_API_KEY = "sk-..."

# ── Optional ──
APP_NAME = "AI Eval Lab"
APP_TAGLINE = "Hands-on Python · EDA · ML · GenAI assessment"
MAX_PARALLEL_RUNS = "2"           # keep 2 on Streamlit Cloud (≈1 GB RAM); 6+ on your own server
APP_TIMEZONE = "Asia/Kolkata"
